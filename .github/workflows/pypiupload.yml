name: Release
run-name: ${{ inputs.destination || 'pypi' }} ${{ inputs.version || github.event.release.tag_name }}

on:
  workflow_dispatch:
    inputs:
      destination:
        description: Publish destination
        required: true
        type: choice
        default: testpypi
        options:
          - testpypi
          - pypi
      version:
        description: Base version without v (for example, 12.3.0)
        required: true
        type: string
  release:
    types: [created]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      package-version: ${{ steps.release.outputs.package-version }}
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      test: ${{ steps.release.outputs.test }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require repository admin permission
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          permission=$(gh api \
            "repos/$GITHUB_REPOSITORY/collaborators/$GITHUB_ACTOR/permission" \
            --jq '.permission')
          if [[ "$permission" != "admin" ]]; then
            echo "Only repository admins can run a release; $GITHUB_ACTOR has $permission permission."
            exit 1
          fi

      - name: Validate release
        id: release
        env:
          MANUAL_DESTINATION: ${{ inputs.destination }}
          MANUAL_VERSION: ${{ inputs.version }}
          RELEASE_EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" &&
                  ! ( "$MANUAL_DESTINATION" == "testpypi" &&
                      "$GITHUB_REF" == "refs/heads/andreymarkelov/admin-release-action" ) ]]; then
              echo "Manual releases must run from main, not $GITHUB_REF."
              exit 1
            fi
            tag="v$MANUAL_VERSION"
            test=false
            package_version="$MANUAL_VERSION"
            if [[ "$MANUAL_DESTINATION" == "testpypi" ]]; then
              test=true
              package_version="${MANUAL_VERSION}.dev${GITHUB_RUN_ID}"
            fi
          else
            tag="$RELEASE_EVENT_TAG"
            test=false
            package_version="${tag#v}"
          fi

          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid release tag: $tag. Expected vX.Y.Z with no leading zeroes."
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$test" == "false" ]]; then
            if ! remote_tag=$(git ls-remote --tags origin "refs/tags/$tag"); then
              echo "Unable to check whether tag $tag already exists."
              exit 1
            fi
            if [[ -n "$remote_tag" ]]; then
              echo "Tag $tag already exists."
              exit 1
            fi
          fi

          {
            echo "package-version=$package_version"
            echo "sha=$(git rev-parse HEAD)"
            echo "tag=$tag"
            echo "test=$test"
            echo "version=${tag#v}"
          } >> "$GITHUB_OUTPUT"

  checks:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - name: Setup Python environment
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pytest ruff sphinx twine
          python -m pip install -r requirements.txt
          python -m pip install -r test/requirements.txt

      - name: Run linter
        run: |
          ruff check --exclude dropbox/_version.py dropbox example test
          ruff format --check --exclude dropbox/_version.py dropbox example test

      - name: Build and validate distributions
        run: |
          python -m build
          twine check dist/*

      - name: Install checked wheel
        run: python -m pip install --force-reinstall dist/*.whl

      - name: Run unit tests
        run: pytest -v test/unit/

      - name: Build documentation
        run: sphinx-build -b html docs build/html

  create-tag:
    if: github.event_name == 'workflow_dispatch' && inputs.destination == 'pypi'
    needs: [prepare, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - name: Create and push release tag
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          if ! remote_tag=$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG"); then
            echo "Unable to check whether tag $RELEASE_TAG already exists."
            exit 1
          fi
          if [[ -n "$remote_tag" ]]; then
            echo "Tag $RELEASE_TAG already exists."
            exit 1
          fi
          git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "$RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

  build-distributions:
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.checks.result == 'success' &&
      (needs.prepare.outputs.test == 'true' ||
       github.event_name == 'release' ||
       needs.create-tag.result == 'success')
    needs: [prepare, checks, create-tag]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.test == 'true' && needs.prepare.outputs.sha || format('refs/tags/{0}', needs.prepare.outputs.tag) }}
          fetch-depth: 0

      - name: Verify release tag
        if: needs.prepare.outputs.test != 'true'
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          tag_sha=$(git rev-parse "$RELEASE_TAG^{commit}")
          if [[ "$tag_sha" != "$RELEASE_SHA" ]]; then
            echo "Tag $RELEASE_TAG points to $tag_sha, not validated commit $RELEASE_SHA."
            exit 1
          fi

      - name: Setup Python environment
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Configure unique TestPyPI version
        if: needs.prepare.outputs.test == 'true'
        env:
          PACKAGE_VERSION: ${{ needs.prepare.outputs.package-version }}
        run: echo "SETUPTOOLS_SCM_PRETEND_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"

      - name: Build distributions
        run: |
          python -m build
          twine check dist/*

      - name: Verify built package version
        env:
          VERSION: ${{ needs.prepare.outputs.package-version }}
        run: |
          python - <<'PY'
          import email
          import glob
          import os
          import zipfile

          wheels = glob.glob("dist/*.whl")
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as wheel:
              metadata_file = next(
                  name for name in wheel.namelist() if name.endswith(".dist-info/METADATA")
              )
              metadata = email.message_from_bytes(wheel.read(metadata_file))
          assert metadata["Version"] == os.environ["VERSION"], (
              metadata["Version"],
              os.environ["VERSION"],
          )
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    if: needs.prepare.outputs.test != 'true'
    needs: [prepare, build-distributions]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: release-distributions
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  publish-testpypi:
    if: needs.prepare.outputs.test == 'true'
    needs: [prepare, build-distributions]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: release-distributions
          path: dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/

  create-release:
    if: github.event_name == 'workflow_dispatch' && inputs.destination == 'pypi'
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Events created with GITHUB_TOKEN do not start another workflow. PyPI is
      # therefore published above. Documentation is hosted by Read the Docs, not
      # by a downstream GitHub Actions workflow.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TAG" \
            --verify-tag \
            --generate-notes
